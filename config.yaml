# Elenco dei server da monitorare.
# host: IP o hostname
# port: (opzionale) porta TCP da verificare per stabilire la raggiungibilita'
#       (default 80 se omessa). Il ping ICMP non e' usato: dentro il
#       container dell'App non e' disponibile ne' il binario ne' i privilegi
#       necessari, quindi si verifica una connessione TCP sulla porta.
servers:
  - name: nuc1
    host: nuc1.station
    port: 443

  - name: nuc2
    host: nuc2.station
    port: 8006

  - name: nuc3
    host: nuc3.station
    port: 443
